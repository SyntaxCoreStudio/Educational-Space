<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity Playground</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <div class="starfield"></div>

    <div class="home">
      <a class="home-button" href="../modules/index.html">Home</a>
    </div>

    <main class="container">
      <header class="header">
        <h1>Gravity Playground</h1>
        <p>Pick a world and see how your weight changes.</p>
      </header>

      <section class="card">
        <div class="planet-visual">
          <div class="planet-icon" aria-hidden="true">
            <img
              id="planetImg"
              src="../assets/planets/earth.jpg"
              alt=""
              loading="eager"
              decoding="async"
            />
            <span id="planetIconFallback">🌍</span>
          </div>
          <div class="planet-meta">
            <div class="planet-name" id="planetName">Earth</div>
            <div class="planet-desc" id="planetDesc">Our home world</div>
          </div>
        </div>

        <label for="weight">Your weight on Earth (kg):</label>
        <input id="weight" type="number" min="1" placeholder="e.g. 80" />

        <label for="world">Choose a world:</label>
        <select id="world">
          <option value="Mercury">Mercury</option>
          <option value="Venus">Venus</option>
          <option value="Earth">Earth</option>
          <option value="Moon">Moon</option>
          <option value="Mars">Mars</option>
          <option value="Jupiter">Jupiter</option>
          <option value="Saturn">Saturn</option>
          <option value="Uranus">Uranus</option>
          <option value="Neptune">Neptune</option>
        </select>

        <button id="calcBtn">Apply gravity</button>

        <div class="result" id="result">
          Enter your weight and choose a world.
        </div>

        <div class="fact" id="fact">Did you know facts will appear here.</div>
      </section>

      <section class="card">
        <h2>Quick explanation</h2>
        <p>
          Your <strong>mass</strong> stays the same everywhere. Your
          <strong>weight</strong> changes because gravity is different on each
          world.
        </p>
      </section>
    </main>

    <script src="../js/gravity.js"></script>
  </body>
</html>
